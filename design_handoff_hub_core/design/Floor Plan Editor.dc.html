<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<x-dc>
<helmet><script src="./image-slot.js"></script><style>body{margin:0;background:#cfcbc4;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}a{color:#0A84FF;text-decoration:none}a:hover{color:#409CFF}button{font-family:inherit}input{font-family:inherit}::-webkit-scrollbar{width:0;height:0}</style></helmet>
<div style="min-height:100vh;display:flex;padding:32px;box-sizing:border-box">
<div style="margin:auto;width:1194px;height:834px;flex:none;border-radius:44px;border:14px solid #111;box-shadow:0 30px 80px rgba(0,0,0,.3);overflow:hidden;position:relative;background:#000;color:#fff">
<div style="position:absolute;inset:-80px;filter:blur(40px);opacity:.2;background:radial-gradient(38% 42% at 14% 18%,#e0794c 0%,transparent 70%),radial-gradient(36% 40% at 88% 12%,#3d72c2 0%,transparent 70%),radial-gradient(42% 44% at 52% 98%,#2a9384 0%,transparent 70%)"></div>
<div style="position:relative;height:100%;box-sizing:border-box;padding:20px;display:flex;gap:16px">

<section ref="{{ boxRef }}" style="position:relative;flex:1;min-width:0;border-radius:26px;background:#1C1C1E;overflow:hidden;user-select:none;-webkit-user-select:none">
<div style="position:absolute;left:{{ sk.left }};top:{{ sk.top }};width:{{ sk.size }};height:{{ sk.size }};transform:rotate({{ sk.rot }});opacity:{{ sk.op }};pointer-events:{{ sk.pe }};z-index:{{ sk.z }};visibility:{{ sk.vis }};transition:transform .35s cubic-bezier(.3,1.25,.5,1)"><image-slot id="floorplan-sketch" fit="contain" placeholder="Drop a photo of your sketch" style="width:100%;height:100%"></image-slot></div>
{{ canvas }}
<div style="position:absolute;left:14px;bottom:14px;display:flex;gap:4px;padding:4px;border-radius:22px;background:rgba(44,44,46,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:5">
<button onClick="{{ zoomOut }}" style="width:36px;height:36px;border:none;border-radius:18px;background:transparent;color:#fff;font-size:20px;cursor:pointer" style-hover="background:#3A3A3C">−</button>
<button onClick="{{ zoomFit }}" style="height:36px;border:none;border-radius:18px;padding:0 12px;background:transparent;color:#fff;font-size:14px;font-weight:600;cursor:pointer" style-hover="background:#3A3A3C">Fit</button>
<button onClick="{{ zoomIn }}" style="width:36px;height:36px;border:none;border-radius:18px;background:transparent;color:#fff;font-size:20px;cursor:pointer" style-hover="background:#3A3A3C">+</button>
</div>
<div style="position:absolute;right:16px;bottom:18px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;z-index:5;pointer-events:none"><div style="font-size:12px;font-weight:600;color:rgba(235,235,245,.6)">1 m</div><div style="width:{{ meterPx }};height:6px;border:2px solid rgba(235,235,245,.6);border-top:none;box-sizing:border-box"></div></div>
<div style="position:absolute;left:16px;top:14px;z-index:5;pointer-events:none;padding:6px 12px;border-radius:12px;background:rgba(44,44,46,.85);font-size:13px;font-weight:600;color:rgba(235,235,245,.8)">{{ hint }}</div>
</section>

<aside style="width:300px;flex:none;display:flex;flex-direction:column;gap:12px;min-height:0">
<section style="border-radius:26px;background:#1C1C1E;padding:18px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;flex-direction:column"><div style="font-size:22px;font-weight:700;letter-spacing:-.4px">Floor plan editor</div><div style="font-size:13px;color:rgba(235,235,245,.6)">Saved automatically on this device</div></div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px">
<sc-for list="{{ tools }}" as="t" hint-placeholder-count="5"><button onClick="{{ t.pick }}" style="height:58px;border:none;border-radius:14px;background:{{ t.bg }};color:{{ t.fg }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:background .2s;font-size:12px;font-weight:600"><span style="font-size:17px;line-height:1">{{ t.glyph }}</span>{{ t.name }}</button></sc-for>
</div>
</section>

<sc-if value="{{ hasSelRoom }}" hint-placeholder-val="{{ false }}"><section style="border-radius:26px;background:#1C1C1E;padding:16px 18px;display:flex;flex-direction:column;gap:10px">
<div style="font-size:13px;font-weight:600;color:rgba(235,235,245,.6)">Room</div>
<input value="{{ selName }}" onChange="{{ onName }}" style="height:42px;border:none;border-radius:12px;background:#2C2C2E;color:#fff;font-size:17px;font-weight:600;padding:0 12px;outline:none"></input>
<div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:15px;color:rgba(235,235,245,.6)">{{ selInfo }}</div><button onClick="{{ delSel }}" style="height:34px;border:none;border-radius:17px;padding:0 14px;font-size:14px;font-weight:600;background:#2C2C2E;color:#FF6961;cursor:pointer">Delete</button></div>
</section></sc-if>

<sc-if value="{{ hasSelDoor }}" hint-placeholder-val="{{ false }}"><section style="border-radius:26px;background:#1C1C1E;padding:16px 18px;display:flex;flex-direction:column;gap:10px">
<div style="font-size:13px;font-weight:600;color:rgba(235,235,245,.6)">Width in cm</div>
<div style="display:flex;gap:3px;padding:3px;border-radius:13px;background:#2C2C2E"><sc-for list="{{ doorWidths }}" as="w" hint-placeholder-count="4"><button onClick="{{ w.pick }}" style="flex:1;height:30px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:{{ w.bg }};color:#fff">{{ w.name }}</button></sc-for></div>
<div style="display:flex;gap:3px;padding:3px;border-radius:13px;background:#2C2C2E"><sc-for list="{{ doorKinds }}" as="k" hint-placeholder-count="2"><button onClick="{{ k.pick }}" style="flex:1;height:30px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:{{ k.bg }};color:#fff">{{ k.name }}</button></sc-for></div>
<div style="display:flex;justify-content:flex-end"><button onClick="{{ delSel }}" style="height:34px;border:none;border-radius:17px;padding:0 14px;font-size:14px;font-weight:600;background:#2C2C2E;color:#FF6961;cursor:pointer">Delete</button></div>
</section></sc-if>

<section style="flex:1;min-height:0;border-radius:26px;background:#1C1C1E;padding:16px 10px 12px;display:flex;flex-direction:column;gap:6px">

</div>
</section>

<section style="border-radius:26px;background:#1C1C1E;padding:14px 18px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:15px;font-weight:700">Sketch underlay</div><button onClick="{{ rotateSketch }}" style="height:30px;border:none;border-radius:15px;padding:0 12px;font-size:13px;font-weight:600;background:#2C2C2E;color:#fff;cursor:pointer">Rotate 90°</button></div>

</section>

<div style="display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:6px">

<button onClick="{{ redo }}" style="height:44px;border:none;border-radius:22px;background:#1C1C1E;color:{{ redoColor }};font-size:14px;font-weight:600;cursor:pointer">Redo</button>
<button onClick="{{ openJson }}" style="height:44px;border:none;border-radius:22px;background:#0A84FF;color:#fff;font-size:14px;font-weight:600;cursor:pointer">Export JSON</button>
</div>
</aside>

<sc-if value="{{ showJson }}" hint-placeholder-val="{{ false }}"><div onClick="{{ closeJson }}" style="position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center">
<div onClick="{{ stop }}" style="width:620px;max-height:640px;border-radius:26px;background:#1C1C1E;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 80px rgba(0,0,0,.5)">
<div style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;flex-direction:column"><div style="font-size:20px;font-weight:700">Floor plan JSON</div><div style="font-size:13px;color:rgba(235,235,245,.6)">Units in cm · for the Flutter app</div></div><div style="display:flex;gap:8px"><button onClick="{{ copyJson }}" style="height:36px;border:none;border-radius:18px;padding:0 16px;font-size:14px;font-weight:600;background:#0A84FF;color:#fff;cursor:pointer">{{ copyLabel }}</button><button onClick="{{ closeJson }}" style="height:36px;border:none;border-radius:18px;padding:0 16px;font-size:14px;font-weight:600;background:#2C2C2E;color:#fff;cursor:pointer">Close</button></div></div>
<pre style="margin:0;flex:1;min-height:0;overflow:auto;border-radius:14px;background:#000;padding:14px;font:12px/1.5 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(235,235,245,.85);white-space:pre-wrap">{{ json }}</pre>
</div>
</div></sc-if>

</div>
</div>
</div>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1290,&quot;height&quot;:930}}">

  fitVb(w, h) { const all = this.state.rooms.flatMap(r => r.pts); if (!all.length) return { x: -100, y: -200, w: 1400, h: 1400 * h / w };
