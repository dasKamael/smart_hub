name: ha_client
description: Home Assistant WebSocket client (auth, commands, state events, reconnect) plus an in-process fake server.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  clock: ^1.1.2
  logging: ^1.3.0
  stream_channel: ^2.1.4
  web_socket_channel: ^3.0.3

dev_dependencies:
  coverage: ^1.16.0
  fake_async: ^1.3.3
  lints: ^6.0.0
  test: ^1.26.0
